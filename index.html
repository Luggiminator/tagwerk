<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tagwerk</title>
<meta name="description" content="Tage planen, abhaken und zurückblicken.">
<meta name="theme-color" content="#0b0a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tagwerk">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@200..500&display=swap">
<style>
/* Layout: eine ruhige Spalte (Jost leicht für Text, IBM Plex Mono für Labels und Zahlen), Listen statt Karten, feste Tab-Leiste unten. Nur dunkel, Orange als einzige Akzentfarbe. */
:root {
  --bg: #0b0a09;
  --surface: #151311;
  --surface-2: #1f1c19;
  --line: #2a2622;
  --line-strong: #3b3630;
  --fg: #f4f0ea;
  --muted: #9a9187;
  --faint: #5f5850;
  --accent: #ff7d1f;
  --accent-soft: rgba(255, 125, 31, 0.13);
  --on-accent: #160b02;
  --good: #63c98f;
  --good-soft: rgba(99, 201, 143, 0.12);
  --good-line: rgba(99, 201, 143, 0.30);
  --bad: #ef6359;
  --bad-soft: rgba(239, 99, 89, 0.12);
  --bad-line: rgba(239, 99, 89, 0.30);
  --scrim: rgba(0, 0, 0, 0.6);
  --bar-bg: rgba(11, 10, 9, 0.9);

  --font-display: "Jost", -apple-system, "SF Pro Display", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-ui: "Jost", -apple-system, "SF Pro Text", system-ui, sans-serif;

  --top-inset: env(safe-area-inset-top, 0px);
  --tabbar-h: 62px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-weight: 300;
  font-size: 17px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; text-align: inherit; }
button:disabled { opacity: 0.3; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
strong { font-weight: 500; }

#app {
  max-width: 560px;
  margin: 0 auto;
  padding-top: calc(var(--top-inset) + 20px);
  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 32px);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
#view { display: flex; flex-direction: column; gap: 28px; }

/* ---------- Kopfbereich ---------- */
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.head-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.eyebrow {
  margin: 0;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
 
  font-size: 34px;
  line-height: 1.08;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.sub { margin: 0; color: var(--muted); font-size: 15px; }
.textbtn { color: var(--accent); font-size: 16px; font-weight: 400; padding: 6px 0 6px 8px; white-space: nowrap; }
.backbtn { color: var(--accent); font-size: 16px; font-weight: 400; display: inline-flex; align-items: center; gap: 4px; padding: 4px 0; align-self: flex-start; }

.daynav { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.daynav button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--fg); border: 1px solid var(--line); }
.daynav span { min-width: 92px; text-align: center; font-size: 15px; font-weight: 400; }

/* ---------- Fortschritt ---------- */
.progress { display: flex; flex-direction: column; gap: 10px; margin-top: -12px; }
.bar { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.35s ease; }
.bar.all span { background: var(--good); }
.progress-text { margin: 0; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress-text strong { color: var(--fg); }
.progress-text .warn { color: var(--bad); }

/* ---------- Tagesliste ---------- */
.groups { display: flex; flex-direction: column; gap: 22px; }
.group-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.group-head .eyebrow { color: var(--muted); }
.group-count { font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
.rows { display: flex; flex-direction: column; }

.row {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
  width: 100%;
  min-height: 60px;
}
.row:last-child { border-bottom: 0; }
.row-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-name { font-weight: 400; font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; display: inline-flex; align-items: center; gap: 6px; }
.row-meta { font-size: 13.5px; color: var(--muted); }
.row-meta .over { color: var(--bad); }
.row-meta .left { color: var(--muted); }
.rec { color: var(--faint); flex: none; }
.is-done .row-name { color: var(--muted); }

.tick {
  width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px solid var(--faint);
  display: grid; place-items: center;
  color: var(--on-accent);
  font-size: 13px; font-weight: 500; line-height: 1;
  transition: background 0.2s ease, border-color 0.2s ease;
}
.tick.on { background: var(--accent); border-color: var(--accent); }
.tick.limit { color: var(--faint); border-style: dashed; }
.tick.limit.over { color: var(--bad); border-color: var(--bad); border-style: solid; }

.stepper { display: inline-flex; align-items: center; gap: 2px; }
.stepper button {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--line-strong);
  display: grid; place-items: center;
  font-size: 19px; font-weight: 300; line-height: 1;
}
.stepper button:active { background: var(--surface-2); }
.stepper .val { min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 400; }
.of { color: var(--faint); font-weight: 300; }
.val.over, .dur.over { color: var(--bad); }

.dur {
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 15px; font-weight: 400;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.dur:active { background: var(--surface-2); }

.row-edit { grid-template-columns: 26px minmax(0, 1fr) auto; }
.remove {
  width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  color: var(--muted);
  display: grid; place-items: center;
}
.remove:active { border-color: var(--bad); color: var(--bad); }

.addbtn {
  display: flex; align-items: center; gap: 12px;
  color: var(--accent); font-weight: 400; font-size: 16px;
  padding: 10px 0;
}
.addbtn .plus { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--accent); display: grid; place-items: center; font-size: 18px; line-height: 1; }

.empty { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; padding: 8px 0; }
.empty p { margin: 0; color: var(--muted); max-width: 34ch; }
.empty .btns { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- Notiz ---------- */
.note { display: flex; flex-direction: column; gap: 10px; }
.note-input {
  width: 100%;
  min-height: 84px;
  resize: none;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
  font-size: 17px;
  line-height: 1.45;
  font-weight: 300;
}
.note-input::placeholder { color: var(--faint); }
.note-input:focus { outline: none; border-color: var(--line-strong); }

/* ---------- Karte "Morgen" ---------- */
.nextcard {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-radius: 16px;
  width: 100%;
}
.nextcard .nc { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.nextcard .nc-text { font-size: 16px; font-weight: 400; }
.nextcard .nc-text.todo { color: var(--accent); }
.chev { color: var(--faint); flex: none; }

.notice { margin: 0; font-size: 13px; color: var(--faint); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px;
  padding: 0 20px;
  border-radius: 999px;
  font-weight: 500; font-size: 16px;
  white-space: nowrap;
}
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:active { filter: brightness(0.92); }
.btn.ghost { border: 1px solid var(--line-strong); color: var(--fg); font-weight: 400; }
.btn.danger { border: 1px solid var(--bad-line); color: var(--bad); font-weight: 400; }
.btn.danger-solid { background: var(--bad); color: var(--on-accent); }

/* ---------- Verlauf ---------- */
.hist { display: flex; flex-direction: column; gap: 8px; }
.month { margin: 14px 0 4px; }
.month:first-child { margin-top: 0; }
.hrow {
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
  padding: 12px 16px 12px 12px;
  border-radius: 14px;
  border: 1px solid var(--line);
  width: 100%;
}
.hrow.s-good { background: var(--good-soft); border-color: var(--good-line); }
.hrow.s-bad { background: var(--bad-soft); border-color: var(--bad-line); }
.hrow.s-open { background: var(--surface); }
.hrow.s-empty { border-style: dashed; }
.hrow.s-empty .hdate, .hrow.s-empty .hstat { color: var(--faint); }
.hdate { display: flex; flex-direction: column; align-items: center; line-height: 1; gap: 4px; }
.hdate .wd { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.hdate .dn { font-family: var(--font-display); font-weight: 300; font-size: 26px; font-variant-numeric: tabular-nums lining-nums; }
.hmid { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hstat { font-size: 15.5px; font-weight: 400; }
.s-good .hstat { color: var(--good); }
.s-bad .hstat { color: var(--bad); }
.hnote { font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hcount { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
.more-btn { align-self: center; margin-top: 8px; }

.pill {
  display: inline-flex; align-self: flex-start;
  padding: 4px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
  border: 1px solid var(--line); color: var(--muted);
}
.pill.s-good { color: var(--good); border-color: var(--good-line); background: var(--good-soft); }
.pill.s-bad { color: var(--bad); border-color: var(--bad-line); background: var(--bad-soft); }

/* ---------- Katalog ---------- */
.cats { display: flex; flex-direction: column; }
.cat { border-bottom: 1px solid var(--line); }
.cat-head {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center;
  width: 100%; padding: 18px 0;
}
.cat-name { font-family: var(--font-display); font-weight: 300; font-size: 23px; line-height: 1.15; }
.cat-count { color: var(--faint); font-size: 15px; font-variant-numeric: tabular-nums; }
.cat-head .chev { transition: transform 0.2s ease; }
.cat-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
.cat-body { padding-bottom: 14px; }
.act {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center;
  width: 100%; padding: 11px 0; border-top: 1px solid var(--line);
}
.act:first-child { border-top: 0; }
.cat-actions { display: flex; flex-wrap: wrap; gap: 8px 20px; padding-top: 8px; }
.linkbtn { color: var(--accent); font-weight: 400; font-size: 15px; padding: 6px 0; }
.linkbtn.quiet { color: var(--muted); }

/* ---------- Mehr ---------- */
.panel { display: flex; flex-direction: column; gap: 12px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
.panel:last-child { border-bottom: 0; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 300; font-size: 23px; }
.panel p { margin: 0; color: var(--muted); font-size: 15.5px; max-width: 60ch; }
.panel p strong { color: var(--fg); }
.steps { margin: 0; padding-left: 22px; color: var(--muted); font-size: 15.5px; display: flex; flex-direction: column; gap: 6px; }
.steps strong { color: var(--fg); }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; }
.confirm { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; border: 1px solid var(--bad-line); background: var(--bad-soft); border-radius: 14px; }
.confirm p { color: var(--fg); }
.foot { color: var(--faint); font-size: 13px; text-align: center; }

/* ---------- Tab-Leiste ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--bar-bg);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  backdrop-filter: blur(18px) saturate(140%);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.tabbar-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--faint); font-size: 11px; font-weight: 400; letter-spacing: 0.02em; text-align: center; }
.tab[aria-current="page"] { color: var(--accent); }
.tab svg { width: 24px; height: 24px; }

/* ---------- Bottom Sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; transition: opacity 0.2s ease; }
.sheet.open { opacity: 1; }
.sheet-panel {
  position: absolute; left: 0; right: 0; bottom: 0;
  max-width: 560px; margin: 0 auto;
  max-height: calc(100% - var(--top-inset) - 24px);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  background: var(--surface);
  border-radius: 22px 22px 0 0;
  border-top: 1px solid var(--line);
  padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  transform: translateY(24px);
  transition: transform 0.24s cubic-bezier(.2, .8, .2, 1);
  display: flex; flex-direction: column; gap: 20px;
}
.sheet.open .sheet-panel { transform: none; }
.grab { width: 38px; height: 4px; border-radius: 4px; background: var(--line-strong); align-self: center; flex: none; }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sheet-head > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.sheet-title { margin: 0; font-family: var(--font-display); font-weight: 300; font-size: 26px; line-height: 1.15; overflow-wrap: anywhere; }
.iconbtn { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); flex: none; }
.sheet-actions { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.sheet-actions .btn { flex: 1 1 auto; }

.form { display: flex; flex-direction: column; gap: 20px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .label { font-size: 13px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.opt { text-transform: none; letter-spacing: 0; font-weight: 300; color: var(--faint); }
.input {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 17px; font-weight: 400;
  min-height: 48px;
  -webkit-appearance: none; appearance: none;
}
.input:focus { outline: none; border-color: var(--accent); }
.input::placeholder { color: var(--faint); font-weight: 300; }
select.input { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 40px; }
.inline { display: flex; gap: 10px; align-items: center; }
.input.num { width: 110px; flex: none; font-variant-numeric: tabular-nums; }
.unit { color: var(--muted); }
.hint { margin: 0; font-size: 13.5px; color: var(--faint); }
.form-error { margin: 0; color: var(--bad); font-size: 15px; }

.seg { display: flex; border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; background: var(--bg); }
.seg-btn { flex: 1; text-align: center; padding: 10px 6px; border-radius: 9px; color: var(--muted); font-size: 15px; font-weight: 400; }
.seg-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

.days { display: flex; gap: 6px; flex-wrap: wrap; }
.day-chip { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line-strong); font-size: 14px; font-weight: 400; display: grid; place-items: center; color: var(--muted); }
.day-chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }

.bignum { display: flex; align-items: baseline; gap: 10px; }
.bignum input {
  width: 4.2ch;
  min-width: 120px;
  background: transparent; border: 0; border-bottom: 1px solid var(--line-strong);
  font-family: var(--font-display); font-weight: 300;
  font-size: 56px; line-height: 1.1; padding: 0 0 4px;
  font-variant-numeric: tabular-nums lining-nums;
  border-radius: 0;
}
.bignum input:focus { outline: none; border-bottom-color: var(--accent); }
.bignum span { color: var(--muted); font-size: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 15px; font-weight: 400; font-variant-numeric: tabular-nums; }
.chip:active { background: var(--surface-2); }
.chip.goal { border-color: var(--accent); color: var(--accent); }

.pick-list { display: flex; flex-direction: column; gap: 18px; }
.pick-group { display: flex; flex-direction: column; }
.pick-group .eyebrow { padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.pick { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 11px 0; border-bottom: 1px solid var(--line); }
.pick:last-child { border-bottom: 0; }
.pick-mark { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; color: var(--accent); font-size: 18px; line-height: 1; }
.pick.added .pick-mark { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pick.added .row-name { color: var(--muted); }

/* ---------- Toast ---------- */
.toast {
  position: fixed; z-index: 60;
  left: 50%; transform: translate(-50%, 12px);
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 14px);
  max-width: calc(100% - 40px);
  display: flex; align-items: center; gap: 16px;
  background: var(--fg); color: var(--bg);
  padding: 11px 18px; border-radius: 999px;
  font-size: 15px; font-weight: 400;
  opacity: 0; pointer-events: none; white-space: nowrap;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast-btn { color: var(--accent); font-weight: 500; filter: brightness(0.85); }


/* ---------- Version 1.1: technische Typo, Stimmung, Favoriten ---------- */
.title { font-weight: 300; letter-spacing: -0.025em; font-size: 36px; line-height: 1.05; }
.eyebrow, .group-count, .hcount, .cat-count, .pill, .tag, .hdate .wd,
.field > label, .field > .label, .stepper .val, .dur, .chip, .foot {
  font-family: var(--font-mono);
}
.eyebrow { font-size: 11.5px; font-weight: 500; letter-spacing: 0.1em; }
.field > label, .field > .label { font-size: 11.5px; letter-spacing: 0.08em; }
.stepper .val, .dur { font-size: 14px; }
.hdate .dn { font-weight: 300; letter-spacing: -0.02em; }
