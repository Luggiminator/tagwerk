<script>
(() => {
'use strict';

const PREVIEW = /*PREVIEW*/false;
const VERSION = '1.1';
const STORE_KEY = 'tagwerk.v1'; // Schlüssel bleibt gleich, damit vorhandene Daten erhalten bleiben
const ONCE = 'einmalig';

/* ---------- Helfer ---------- */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const diffDays = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 86400000);
const WD_LONG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const WD_SHORT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clampInt = (v, min, max) => { const n = Math.round(Number(v)); if (!Number.isFinite(n)) return min; return Math.min(max, Math.max(min, n)); };
const clone = o => JSON.parse(JSON.stringify(o));

function longDate(k) {
  const d = parseKey(k);
  const y = d.getFullYear() !== new Date().getFullYear() ? ` ${d.getFullYear()}` : '';
  return `${WD_LONG[d.getDay()]}, ${d.getDate()}. ${MONTHS[d.getMonth()]}${y}`;
}
function relLabel(k) {
  const n = diffDays(todayKey(), k);
  if (n === 0) return 'Heute';
  if (n === 1) return 'Morgen';
  if (n === 2) return 'Übermorgen';
  if (n === -1) return 'Gestern';
  return n > 0 ? `in ${n} Tagen` : `vor ${-n} Tagen`;
}
function fmtMin(m) {
  m = Math.round(m || 0);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h} h ${r} min` : `${h} h`;
}
const fmtCount = (n, unit) => unit ? `${n} ${unit}` : `${n}×`;
const condText = c => c ? (c.kind === 'before' ? `vor ${c.time}` : `nach ${c.time}`) : '';

const ICON = {
  check: '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M5 12.6l4.3 4.3L19 7.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  rec: '<svg class="rec" viewBox="0 0 24 24" width="14" height="14" aria-label="wiederkehrend"><path d="M4.5 12a7.5 7.5 0 0 1 13-5.1M19.5 12a7.5 7.5 0 0 1-13 5.1M17.8 3.6v3.6h-3.6M6.2 20.4v-3.6h3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5.5l6.5 6.5L9 18.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5.5L8.5 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  fwd: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5.5l6.5 6.5L9 18.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  close: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  minus: '<svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M6 12h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  star: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3.6l2.5 5.3 5.8.7-4.3 4 1.1 5.7L12 16.5l-5.1 2.8 1.1-5.7-4.3-4 5.8-.7z" fill="var(--star-fill, none)" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  clock: '<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" style="vertical-align:-1px"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
};
const MOODS = [
  [1, 'Mies', 'M8.3 16.4c2-2 5.4-2 7.4 0'],
  [2, 'Okay', 'M8.6 15.2h6.8'],
  [3, 'Gut', 'M8.3 14.2c2 2.1 5.4 2.1 7.4 0'],
];
function face(v, size = 30) {
  const m = MOODS.find(x => x[0] === v); if (!m) return '';
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="9.2" cy="10" r="1" fill="currentColor"/><circle cx="14.8" cy="10" r="1" fill="currentColor"/><path d="${m[2]}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`;
}

/* ---------- Daten ---------- */
const DEFAULT_FAVS = ['Wäsche waschen', 'Spülmaschine ausräumen', 'Haushalt allgemein', 'Spazieren gehen', 'Sport', 'Wasser trinken', 'Ins Bett gehen', 'Vor 23 Uhr ins Bett', 'Spezi', 'Lesen', 'Serie oder Film', 'E-Mails', 'Familie anrufen'];

function seedCatalog(s) {
  s.categories = [
    { id: ONCE, name: 'Einmalig', once: true },
    { id: 'haushalt', name: 'Haushalt' },
    { id: 'koerper', name: 'Bewegung & Gesundheit' },
    { id: 'genuss', name: 'Genuss' },
    { id: 'orga', name: 'Organisation' },
    { id: 'menschen', name: 'Menschen' },
  ];
  const A = (cat, name, type, o = {}) => ({
    id: uid(), cat, name, type,
    target: o.t ?? null, dir: o.dir || 'min', est: o.est ?? null, unit: o.unit || '',
    rep: o.rep || { kind: 'none', days: [] }, cond: o.cond || null, fav: DEFAULT_FAVS.includes(name),
  });
  s.activities = [
    A(ONCE, 'Winterreifen wechseln lassen', 'check', { est: 60 }),
    A('haushalt', 'Wäsche waschen', 'check', { est: 15 }),
    A('haushalt', 'Wäsche aufhängen', 'check', { est: 10 }),
    A('haushalt', 'Spülmaschine ausräumen', 'check', { est: 10 }),
    A('haushalt', 'Staubsaugen', 'check', { est: 20 }),
    A('haushalt', 'Bad putzen', 'check', { est: 30 }),
    A('haushalt', 'Müll rausbringen', 'check', { est: 5 }),
    A('haushalt', 'Einkaufen', 'check', { est: 45 }),
    A('haushalt', 'Blumen gießen', 'check', { est: 10, rep: { kind: 'weekly', days: [6] } }),
    A('haushalt', 'Haushalt allgemein', 'duration', { t: 60 }),
    A('koerper', 'Spazieren gehen', 'duration', { t: 30 }),
    A('koerper', 'Sport', 'duration', { t: 45 }),
    A('koerper', 'Dehnen', 'duration', { t: 10 }),
    A('koerper', 'Wasser trinken', 'count', { t: 6, unit: 'Gläser' }),
    A('koerper', 'Ins Bett gehen', 'check', { cond: { kind: 'before', time: '23:00' } }),
    A('genuss', 'Spezi', 'count', { t: 2, dir: 'max' }),
    A('genuss', 'Kaffee', 'count', { t: 2, dir: 'max', unit: 'Tassen', cond: { kind: 'before', time: '15:00' } }),
    A('genuss', 'Süßes', 'count', { t: 1, dir: 'max', unit: 'Portion' }),
    A('genuss', 'Serie oder Film', 'duration', { t: 90, dir: 'max' }),
    A('genuss', 'Social Media', 'duration', { t: 30, dir: 'max' }),
    A('genuss', 'Lesen', 'duration', { t: 20 }),
    A('genuss', 'Musik hören', 'duration', { t: 15 }),
    A('genuss', 'Baden', 'check', { est: 30 }),
    A('orga', 'Post & Rechnungen', 'check', { est: 15 }),
    A('orga', 'E-Mails', 'duration', { t: 30 }),
    A('orga', 'Woche planen', 'check', { est: 15, rep: { kind: 'weekly', days: [0] } }),
    A('menschen', 'Familie anrufen', 'check', { est: 20 }),
    A('menschen', 'Freunde treffen', 'check'),
    A('menschen', 'Jemandem schreiben', 'check', { est: 5 }),
  ];
}

const catById = id => S.categories.find(c => c.id === id);
const isOnceCat = id => { const c = S && S.categories ? S.categories.find(x => x.id === id) : null; return !!(c && c.once); };
const actById = id => S.activities.find(a => a.id === id);

function itemFrom(a, rec = false) {
  const c = S && S.categories ? S.categories.find(x => x.id === a.cat) : null;
  return {
    id: uid(), aid: a.id, name: a.name, cat: a.cat, catName: c ? c.name : '',
    type: a.type, target: a.type === 'check' ? null : a.target, dir: a.dir, unit: a.unit || '', est: a.est ?? null,
    cond: a.cond ? clone(a.cond) : null, once: !!(c && c.once),
    done: false, value: 0, at1: null, at2: null, rec,
  };
}

function repMatches(a, weekday) {
  if (!a.rep || a.rep.kind === 'none') return false;
  if (a.rep.kind === 'daily') return true;
  return (a.rep.days || []).includes(weekday);
}

function seedDemo(s, full) {
  const t = todayKey();
  const find = n => s.activities.find(a => a.name === n);
  const mk = (list) => list.map(([n, v]) => {
    const a = find(n); if (!a) return null;
    const it = itemFrom(a);
    if (a.type === 'check') it.done = !!v; else it.value = v;
    return it;
  }).filter(Boolean);
  const past = [
    [6, 3, [['Wäsche waschen', 1], ['Spazieren gehen', 35], ['Spezi', 1], ['Lesen', 20], ['Wasser trinken', 6]], 'Ruhiger Tag, endlich mal wieder gelesen.'],
    [5, 2, [['Staubsaugen', 1], ['Sport', 45], ['Spezi', 3], ['Kaffee', 2], ['E-Mails', 30]], 'Ein Spezi zu viel beim Grillen. Sonst gut.'],
    [4, 3, [['Haushalt allgemein', 60], ['Spazieren gehen', 30], ['Spezi', 2], ['Familie anrufen', 1]], 'Mama angerufen, lange gequatscht.'],
    [3, 1, [['Bad putzen', 0], ['Sport', 20], ['Serie oder Film', 120], ['Lesen', 10]], 'Müde. Sport nach 20 Minuten abgebrochen.'],
    [2, 3, [['Einkaufen', 1], ['Wasser trinken', 7], ['Spezi', 1], ['Post & Rechnungen', 1], ['Dehnen', 10]], 'Alles geschafft.'],
    [1, 3, [['Wäsche aufhängen', 1], ['Spazieren gehen', 45], ['Social Media', 25], ['Lesen', 30], ['Kaffee', 1]], 'Schöner Herbstspaziergang am Fluss.'],
  ];
  past.forEach(([i, mood, list, note]) => {
    const k = addDays(t, -i);
    if (s.days[k]) return;
    s.days[k] = { items: mk(list), note, mood, demo: true };
  });
  if (full) {
    if (!s.days[t]) {
      const items = mk([['Wäsche waschen', 1], ['Haushalt allgemein', 20], ['Spazieren gehen', 0], ['Ins Bett gehen', 0], ['Spezi', 1], ['Kaffee', 2], ['Lesen', 0], ['Winterreifen wechseln lassen', 0]]);
      const kaffee = items.find(i => i.name === 'Kaffee'); if (kaffee) { kaffee.at1 = '08:10'; kaffee.at2 = '16:20'; }
      s.days[t] = { items, note: '', mood: null, demo: true };
    }
    const tm = addDays(t, 1);
    if (!s.days[tm]) s.days[tm] = { items: mk([['Staubsaugen', 0], ['Sport', 0], ['Spezi', 0], ['Lesen', 0], ['Freunde treffen', 0]]), note: '', demo: true };
  }
}

function normalize(s) {
  if (!Array.isArray(s.categories)) s.categories = [];
  if (!Array.isArray(s.activities)) s.activities = [];
  if (!s.days || typeof s.days !== 'object') s.days = {};
  if (!s.ui || typeof s.ui !== 'object') s.ui = {};
  if (!s.ui.open || typeof s.ui.open !== 'object') s.ui.open = {};
  // Version 1 -> 2: Kategorie "Einmalig", Favoriten, Zeitbedingungen, Stimmung
  if (!s.categories.some(c => c.once)) s.categories.unshift({ id: ONCE, name: 'Einmalig', once: true });
  const firstV2 = (s.v || 1) < 2;
  s.activities.forEach(a => {
    if (!a.rep) a.rep = { kind: 'none', days: [] };
    if (!a.dir) a.dir = 'min';
    if (a.unit == null) a.unit = '';
    if (a.cond === undefined) a.cond = null;
    if (a.fav === undefined) a.fav = firstV2 ? DEFAULT_FAVS.includes(a.name) : false;
  });
  Object.values(s.days).forEach(d => {
    if (!Array.isArray(d.items)) d.items = [];
    if (d.note == null) d.note = '';
    if (d.mood === undefined) d.mood = null;
    d.items.forEach(i => { if (i.cond === undefined) i.cond = null; });
  });
  s.v = 2;
  return s;
}

let S = null;
function freshState() {
  const s = { v: 2, categories: [], activities: [], days: {}, ui: { open: {} }, lastBackup: null };
  S = s;
  seedCatalog(s);
  return s;
}
function load() {
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { /* kein Speicher verfügbar */ }
  if (raw) { try { return normalize(JSON.parse(raw)); } catch (e) { /* defekt -> neu */ } }
  const s = freshState();
  if (PREVIEW) seedDemo(s, true);
  return s;
}
S = load();

let saveWarned = false;
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch (e) { if (!saveWarned && !PREVIEW) { saveWarned = true; toast('Speichern ist gerade nicht möglich.'); } }
}
save();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* optional */ }

function getDay(k, create) {
  let d = S.days[k];
  if (!d && create) {
    d = { items: [], note: '', mood: null };
    if (k >= todayKey()) {
      const wd = parseKey(k).getDay();
      S.activities.filter(a => repMatches(a, wd)).forEach(a => d.items.push(itemFrom(a, true)));
    }
    S.days[k] = d;
    save();
  }
  return d || { items: [], note: '', mood: null, virtual: true };
}
const findItem = (k, id) => (S.days[k] ? S.days[k].items.find(i => i.id === id) : null);

/* ---------- Auswertung ---------- */
function condOk(it) {
  if (!it.cond || !it.at2) return true;
  return it.cond.kind === 'before' ? it.at2 < it.cond.time : it.at1 >= it.cond.time;
}
const condBad = it => !!(it.cond && it.at2 && !condOk(it));
function met(it) {
  let base;
  if (it.type === 'check') base = !!it.done;
  else base = it.dir === 'max' ? (it.value || 0) <= it.target : (it.value || 0) >= it.target;
  return base && condOk(it);
}
function stats(d) {
  const total = d.items.length;
  return { total, met: d.items.filter(met).length };
}
function dayStatus(k) {
  const d = S.days[k];
  if (!d || !d.items.length) return 'empty';
  const st = stats(d);
  if (st.met === st.total) return 'good';
  const t = todayKey();
  if (k < t) return 'bad';
  return k === t ? 'open' : 'planned';
}
function planMinutes(d) {
  return d.items.reduce((sum, it) => {
    if (it.type === 'check') return sum + (it.est || 0);
    if (it.type === 'duration' && it.dir !== 'max') return sum + (it.target || 0);
    return sum;
  }, 0);
}
// Uhrzeit merken, wenn am selben Tag abgehakt oder eingetragen wird
function stamp(k, it, active) {
  if (!active) { it.at1 = null; it.at2 = null; return; }
  if (k !== todayKey()) return;
  const t = nowHM();
  if (!it.at1) it.at1 = t;
  it.at2 = t;
}

/* ---------- Oberflächenzustand ---------- */
const U = { view: 'today', planKey: null, detailKey: null, edit: {}, histLimit: 60, confirmWipe: false, pendingImport: null, renderedToday: todayKey(), catQuery: '' };
const SH = { type: null, ctx: null };

/* ---------- Bausteine ---------- */
function goalText(type, target, dir, unit) {
  if (type === 'count') return (dir === 'max' ? 'höchstens ' : 'Ziel ') + fmtCount(target, unit);
  if (type === 'duration') return (dir === 'max' ? 'höchstens ' : 'Ziel ') + fmtMin(target);
  return '';
}
function metaDo(it) {
  const parts = [];
  if (it.once && it.done) parts.push('einmalig erledigt');
  else if (it.type === 'check') { if (it.est) parts.push(`≈ ${fmtMin(it.est)}`); }
  else parts.push(esc(goalText(it.type, it.target, it.dir, it.unit)));
  if (it.cond) {
    const when = it.cond.kind === 'before' ? it.at2 : it.at1;
    if (condBad(it)) parts.push(`<span class="over">${ICON.clock} ${condText(it.cond)}, war ${when}</span>`);
    else if (when) parts.push(`${ICON.clock} ${condText(it.cond)} · ${when}`);
    else parts.push(`${ICON.clock} ${condText(it.cond)}`);
  }
  if (it.type !== 'check' && it.dir === 'max') {
    const rest = it.target - (it.value || 0);
    const f = it.type === 'duration' ? fmtMin : (n => fmtCount(n, it.unit));
    if (rest < 0) parts.push(`<span class="over">${esc(f(-rest))} zu viel</span>`);
    else if (it.value > 0) parts.push(`noch ${esc(f(rest))}`);
  }
  return parts.join(' · ');
}
function metaEdit(it) {
  const parts = [];
  if (it.type === 'check') parts.push(it.once ? 'Einmalig · Dauer' : 'Dauer heute');
  else parts.push((it.dir === 'max' ? 'höchstens' : 'mindestens') + (it.type === 'count' && it.unit ? ` ${esc(it.unit)}` : ''));
  if (it.cond) parts.push(`${ICON.clock} ${condText(it.cond)}`);
  return parts.join(' · ');
}
function nameHtml(it) { return `<span class="row-name">${esc(it.name)}${it.rec ? ICON.rec : ''}</span>`; }

function stepper(k, it, field, label, over) {
  const less = field === 'value' ? 'weniger' : 'Ziel verringern';
  const more = field === 'value' ? 'mehr' : 'Ziel erhöhen';
  return `<div class="stepper">
    <button data-act="step" data-k="${k}" data-id="${it.id}" data-f="${field}" data-d="-1" aria-label="${esc(it.name)} ${less}">−</button>
    ${field === 'value' ? `<span class="val ${over ? 'over' : ''}">${label}</span>` : `<button class="val val-btn" data-act="planVal" data-k="${k}" data-id="${it.id}" data-f="${field}" aria-label="${esc(it.name)}: Wert eingeben">${label}</button>`}
    <button data-act="step" data-k="${k}" data-id="${it.id}" data-f="${field}" data-d="1" aria-label="${esc(it.name)} ${more}">+</button>
  </div>`;
}

function tickHtml(it) {
  const isMax = it.type !== 'check' && it.dir === 'max';
  const bad = (isMax && it.value > it.target) || condBad(it);
  if (bad) return '<span class="tick limit over" aria-hidden="true">!</span>';
  if (isMax) return '<span class="tick limit" aria-hidden="true">≤</span>';
  return met(it) ? `<span class="tick on" aria-hidden="true">${ICON.check}</span>` : '<span class="tick" aria-hidden="true"></span>';
}

function rowDo(k, it) {
  const isMax = it.type !== 'check' && it.dir === 'max';
  const over = isMax && it.value > it.target;
  const meta = metaDo(it);
  if (it.type === 'check') {
    return `<button class="row ${it.done ? 'is-done' : ''}" data-act="toggle" data-k="${k}" data-id="${it.id}" aria-pressed="${it.done}">
      ${tickHtml(it)}
      <span class="row-body">${nameHtml(it)}${meta ? `<span class="row-meta">${meta}</span>` : ''}</span>
      <span></span>
    </button>`;
  }
  const ctrl = it.type === 'count'
    ? stepper(k, it, 'value', `${it.value || 0}<span class="of">/${it.target}</span>`, over)
    : `<button class="dur ${over ? 'over' : ''}" data-act="dur" data-k="${k}" data-id="${it.id}" aria-label="${esc(it.name)}: Zeit eintragen">${it.value || 0}<span class="of"> / ${it.target} min</span></button>`;
  return `<div class="row ${met(it) && !isMax ? 'is-done' : ''}">${tickHtml(it)}<span class="row-body">${nameHtml(it)}<span class="row-meta">${meta}</span></span>${ctrl}</div>`;
}

function rowEdit(k, it) {
  let ctrl = stepper(k, it, 'est', `${it.est ? it.est : '–'}<span class="of"> min</span>`, false);
  if (it.type === 'count') ctrl = stepper(k, it, 'target', `${it.target}${it.unit ? '' : '×'}`, false);
  if (it.type === 'duration') ctrl = stepper(k, it, 'target', `${it.target}<span class="of"> min</span>`, false);
  return `<div class="row row-edit">
    <button class="remove" data-act="removeItem" data-k="${k}" data-id="${it.id}" aria-label="${esc(it.name)} entfernen">${ICON.minus}</button>
    <span class="row-body">${nameHtml(it)}<span class="row-meta">${metaEdit(it)}</span></span>
    ${ctrl}
  </div>`;
}

function grouped(items) {
  const order = new Map(S.categories.map((c, i) => [c.id, i]));
  const aIdx = new Map(S.activities.map((a, i) => [a.id, i]));
  const g = new Map();
  items.forEach(it => {
    const known = order.has(it.cat);
    const key = known ? it.cat : '_' + (it.catName || 'Sonstiges');
    if (!g.has(key)) g.set(key, { name: known ? catById(it.cat).name : (it.catName || 'Sonstiges'), sort: known ? order.get(it.cat) : 999, items: [] });
    g.get(key).items.push(it);
  });
  const arr = [...g.values()].sort((a, b) => a.sort - b.sort);
  arr.forEach(x => x.items.sort((a, b) => (aIdx.has(a.aid) ? aIdx.get(a.aid) : 9999) - (aIdx.has(b.aid) ? aIdx.get(b.aid) : 9999)));
  return arr;
}

function dayList(k, d, mode, emptyText) {
  if (!d.items.length) {
    const t = todayKey();
    const today = S.days[t];
    const canCopy = k > t && today && today.items.some(i => !i.once);
    return `<div class="empty">
      <p>${emptyText}</p>
      <div class="btns">
        <button class="btn primary" data-act="openPicker" data-k="${k}">Aktivitäten auswählen</button>
        ${canCopy ? `<button class="btn ghost" data-act="copyToday" data-k="${k}">Wie heute planen</button>` : ''}
      </div>
    </div>`;
  }
  const groups = grouped(d.items).map(g => {
    const okN = g.items.filter(met).length;
    return `<section>
      <div class="group-head"><p class="eyebrow">${esc(g.name)}</p>${mode === 'do' ? `<span class="group-count">${okN}/${g.items.length}</span>` : ''}</div>
      <div class="rows">${g.items.map(it => mode === 'do' ? rowDo(k, it) : rowEdit(k, it)).join('')}</div>
    </section>`;
  }).join('');
  return `<div class="groups">${groups}
    <button class="addbtn" data-act="openPicker" data-k="${k}"><span class="plus" aria-hidden="true">+</span>Aktivität hinzufügen</button>
  </div>`;
}

function progress(d) {
  const st = stats(d);
  const pct = st.total ? Math.round(st.met / st.total * 100) : 0;
  const all = st.met === st.total;
  return `<div class="progress">
    <div class="bar ${all ? 'all' : ''}" role="progressbar" aria-valuemin="0" aria-valuemax="${st.total}" aria-valuenow="${st.met}"><span style="width:${pct}%"></span></div>
    <p class="progress-text"><strong>${st.met}</strong> von ${st.total} ${st.total === 1 ? 'Ziel' : 'Zielen'} erreicht</p>
  </div>`;
}

function noteBlock(k, d) {
  return `<section class="note">
    <label class="eyebrow" for="note-${k}">Tagesnotiz</label>
    <textarea id="note-${k}" class="note-input" data-note="${k}" rows="2" placeholder="Wie war der Tag? Ein, zwei Sätze zum Abschluss.">${esc(d.note)}</textarea>
    <div class="moods" role="group" aria-label="Stimmung des Tages">
      ${MOODS.map(([v, label]) => `<button class="mood" data-act="mood" data-k="${k}" data-v="${v}" aria-pressed="${d.mood === v}">${face(v)}<span>${label}</span></button>`).join('')}
    </div>
  </section>`;
}

/* ---------- Ansichten ---------- */
function viewToday() {
  const k = todayKey();
  const d = getDay(k, true);
  const edit = !!U.edit[k];
  const tm = addDays(k, 1);
  const td = S.days[tm];
  let next;
  if (td && td.items.length) {
    const m = planMinutes(td);
    next = `<span class="nc-text">${td.items.length} ${td.items.length === 1 ? 'Punkt' : 'Punkte'} geplant${m ? ` · ≈ ${fmtMin(m)}` : ''}</span>`;
  } else {
    next = `<span class="nc-text todo">Noch nicht geplant</span>`;
  }
  return `
    <header class="head">
      <div class="head-text"><p class="eyebrow">Heute</p><h1 class="title">${longDate(k)}</h1></div>
      ${d.items.length ? `<button class="textbtn" data-act="toggleEdit" data-k="${k}">${edit ? 'Fertig' : 'Bearbeiten'}</button>` : ''}
    </header>
    ${d.items.length ? progress(d) : ''}
    ${dayList(k, d, edit ? 'edit' : 'do', 'Für heute ist nichts geplant. Wähl aus, was du dir vornimmst.')}
    ${noteBlock(k, d)}
    <button class="nextcard" data-act="goPlan">
      <span class="nc"><span class="eyebrow">Morgen · ${WD_LONG[parseKey(tm).getDay()]}</span>${next}</span>${ICON.chev}
    </button>
    ${PREVIEW ? '<p class="notice">Vorschau mit Beispieldaten. Deine Daten auf dem iPhone sind davon nicht betroffen.</p>' : ''}`;
}

function viewPlan() {
  const t = todayKey();
  if (!U.planKey || U.planKey < t) U.planKey = addDays(t, 1);
  const k = U.planKey;
  const d = getDay(k, true);
  const m = planMinutes(d);
  const sub = d.items.length ? `${d.items.length} ${d.items.length === 1 ? 'Punkt' : 'Punkte'}${m ? ` · ≈ ${fmtMin(m)} eingeplant` : ''}` : '';
  return `
    <header class="head">
      <div class="head-text"><p class="eyebrow">Planen · <span class="accent">${relLabel(k)}</span></p><h1 class="title">${longDate(k)}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div>
      <div class="daynav">
        <button data-act="planShift" data-d="-1" aria-label="Tag zurück" ${k <= t ? 'disabled' : ''}>${ICON.back}</button>
        <button data-act="planShift" data-d="1" aria-label="Tag vor" ${diffDays(t, k) >= 60 ? 'disabled' : ''}>${ICON.fwd}</button>
      </div>
    </header>
    ${dayList(k, d, 'edit', `Für ${relLabel(k) === 'Morgen' ? 'morgen' : WD_LONG[parseKey(k).getDay()]} ist noch nichts geplant.`)}`;
}

function viewHistory() {
  const t = todayKey();
  const keys = Object.keys(S.days).filter(k => k <= t).sort();
  const first = keys.length ? keys[0] : t;
  const span = Math.max(0, diffDays(first, t));
  const limit = Math.min(span, U.histLimit - 1);
  let html = '', lastMonth = '';
  for (let i = 0; i <= limit; i++) {
    const k = addDays(t, -i);
    const dt = parseKey(k);
    const mKey = `${dt.getFullYear()}-${dt.getMonth()}`;
    if (mKey !== lastMonth) { html += `<p class="eyebrow month">${MONTHS[dt.getMonth()]} ${dt.getFullYear()}</p>`; lastMonth = mKey; }
    const d = S.days[k];
    const st = dayStatus(k);
    const s = d ? stats(d) : { total: 0, met: 0 };
    const label = { good: 'Alle Ziele erreicht', bad: `${s.total - s.met} ${s.total - s.met === 1 ? 'Ziel' : 'Ziele'} verfehlt`, open: 'Läuft noch', empty: 'Nichts geplant' }[st] || '';
    const note = d && d.note ? `<span class="hnote">${esc(d.note)}</span>` : (d && d.demo ? '<span class="hnote tag">Beispiel</span>' : '');
    const mood = d && d.mood ? `<span class="hmood" title="Stimmung: ${MOODS[d.mood - 1][1]}">${face(d.mood, 22)}</span>` : '';
    html += `<button class="hrow s-${st}" data-act="openDay" data-k="${k}">
      <span class="hdate"><span class="wd">${i === 0 ? 'Heute' : WD_SHORT[dt.getDay()]}</span><span class="dn">${dt.getDate()}</span></span>
      <span class="hmid"><span class="hstat">${label}</span>${note}</span>
      <span class="hright">${mood}<span class="hcount">${s.total ? `${s.met}/${s.total}` : ''}</span></span>
    </button>`;
  }
  const moreBtn = span > limit ? `<button class="btn ghost more-btn" data-act="histMore">Ältere Tage zeigen</button>` : '';
  return `
    <header class="head"><div class="head-text"><p class="eyebrow">Verlauf</p><h1 class="title">Deine Tage</h1></div></header>
    <div class="hist">${html}${moreBtn}</div>`;
}

function viewDetail() {
  const k = U.detailKey;
  const d = getDay(k, false);
  const edit = !!U.edit[k];
  const st = dayStatus(k);
  const s = stats(d);
  const pill = { good: 'Alle Ziele erreicht', bad: `${s.total - s.met} verfehlt`, open: 'Läuft noch', empty: 'Nichts geplant' }[st] || '';
  return `
    <button class="backbtn" data-act="closeDetail">${ICON.back}Verlauf</button>
    <header class="head">
      <div class="head-text"><span class="pill s-${st}">${pill}</span><h1 class="title">${longDate(k)}</h1></div>
      ${d.items.length ? `<button class="textbtn" data-act="toggleEdit" data-k="${k}">${edit ? 'Fertig' : 'Bearbeiten'}</button>` : ''}
    </header>
    ${d.items.length ? progress(d) : ''}
    ${dayList(k, d, edit ? 'edit' : 'do', 'An diesem Tag war nichts geplant. Du kannst trotzdem nachtragen, was du gemacht hast.')}
    ${noteBlock(k, d)}`;
}

function actMeta(a) {
  const parts = [];
  if (isOnceCat(a.cat)) { parts.push('Einmalig'); if (a.est) parts.push(`≈ ${fmtMin(a.est)}`); }
  else if (a.type === 'check') { parts.push('Abhaken'); if (a.est) parts.push(`≈ ${fmtMin(a.est)}`); }
  else parts.push((a.type === 'count' ? 'Anzahl · ' : 'Dauer · ') + goalText(a.type, a.target, a.dir, a.unit).replace('Ziel ', 'mind. '));
  if (a.cond) parts.push(condText(a.cond));
  if (a.rep.kind === 'daily') parts.push('täglich');
  if (a.rep.kind === 'weekly' && a.rep.days.length) parts.push('jeden ' + [1, 2, 3, 4, 5, 6, 0].filter(x => a.rep.days.includes(x)).map(x => WD_SHORT[x]).join(', '));
  return parts.join(' · ');
}
const matches = (a, q) => !q || a.name.toLowerCase().includes(q);

function catList() {
  const q = U.catQuery.trim().toLowerCase();
  const html = S.categories.map(c => {
    const all = S.activities.filter(a => a.cat === c.id);
    const acts = all.filter(a => matches(a, q));
    if (q && !acts.length) return '';
    const expanded = !!q || !!c.once || !!S.ui.open[c.id];
    const shown = expanded ? acts : acts.filter(a => a.fav);
    const hidden = acts.length - shown.length;
    const rows = shown.map(a => `<div class="act">
        <button class="act-main" data-act="editAct" data-id="${a.id}">
          <span class="row-body"><span class="row-name">${esc(a.name)}${a.rep.kind !== 'none' ? ICON.rec : ''}</span><span class="row-meta">${esc(actMeta(a))}</span></span>
        </button>
        ${c.once ? '' : `<button class="star" data-act="favToggle" data-id="${a.id}" aria-pressed="${!!a.fav}" aria-label="${esc(a.name)} als Favorit ${a.fav ? 'entfernen' : 'markieren'}">${ICON.star}</button>`}
      </div>`).join('');
    let hint = '';
    if (c.once && !all.length) hint = '<p class="hint cat-hint">Keine offenen Aufgaben. Erledigte einmalige Aufgaben verschwinden von hier.</p>';
    else if (!expanded && !shown.length && hidden) hint = '';
    return `<section class="cat">
      <button class="cat-head" data-act="toggleCat" data-id="${c.id}" aria-expanded="${expanded}" ${c.once ? 'disabled' : ''}>
        <span class="cat-name">${esc(c.name)}</span><span class="cat-count">${all.length}</span>${c.once ? '<span></span>' : ICON.chev}
      </button>
      ${rows || hint ? `<div class="cat-rows">${rows}${hint}</div>` : ''}
      ${!expanded && hidden ? `<button class="pick-more" data-act="toggleCat" data-id="${c.id}">${hidden} weitere anzeigen</button>` : ''}
      ${expanded && !q ? `<div class="cat-actions">
          <button class="linkbtn" data-act="newAct" data-cat="${c.id}">+ ${c.once ? 'Einmalige Aufgabe' : 'Aktivität'}</button>
          <button class="linkbtn quiet" data-act="editCat" data-id="${c.id}">Kategorie bearbeiten</button>
        </div>` : ''}
    </section>`;
  }).join('');
  return html || '<p class="hint">Nichts gefunden.</p>';
}

function viewCatalog() {
  return `
    <header class="head">
      <div class="head-text"><p class="eyebrow">Katalog</p><h1 class="title">Aktivitäten</h1><p class="sub">Favoriten <span class="star-inline">${ICON.star}</span> stehen immer oben. Kategorie antippen zeigt alle.</p></div>
    </header>
    <input id="cat-search" class="input" type="search" placeholder="Aktivitäten durchsuchen" autocomplete="off" enterkeyhint="search" value="${esc(U.catQuery)}">
    <div class="cats" id="cat-list">${catList()}</div>
    <button class="addbtn" data-act="newCat"><span class="plus" aria-hidden="true">+</span>Neue Kategorie</button>`;
}

function viewMore() {
  const days = Object.values(S.days).filter(d => d.items.length || d.note).length;
  let backupInfo = 'Bisher hast du noch kein Backup gesichert.';
  if (S.lastBackup) {
    const n = diffDays(S.lastBackup.slice(0, 10), todayKey());
    backupInfo = `Letztes Backup: ${n === 0 ? 'heute' : n === 1 ? 'gestern' : `vor ${n} Tagen`}.`;
  }
  const hasDemo = Object.values(S.days).some(d => d.demo);
  const pi = U.pendingImport;
  return `
    <header class="head"><div class="head-text"><p class="eyebrow">Mehr</p><h1 class="title">Einstellungen</h1></div></header>

    <section class="panel">
      <h2>Abends erinnern</h2>
      <p>Web-Apps dürfen auf dem iPhone keine Erinnerungen von sich aus planen. Dafür bräuchte es einen Server. Am zuverlässigsten ist eine wiederkehrende Erinnerung in der Erinnerungen-App:</p>
      <ol class="steps">
        <li>Erinnerungen öffnen, neue Erinnerung <strong>„Morgen planen“</strong> anlegen.</li>
        <li>Auf das <strong>ⓘ</strong> tippen, <strong>Uhrzeit</strong> einschalten, z. B. 21:00.</li>
        <li><strong>Wiederholen: Täglich</strong> wählen.</li>
      </ol>
    </section>

    <section class="panel">
      <h2>Speicher &amp; Backup</h2>
      <p>Deine Einträge bleiben <strong>dauerhaft</strong> auf diesem iPhone gespeichert, auch wenn du die App schließt oder das Handy neu startest. Im Moment sind es ${days} ${days === 1 ? 'Tag' : 'Tage'} mit Einträgen und ${S.activities.length} Aktivitäten.</p>
      <p>Verloren gehen die Daten nur, wenn du die App vom Home-Bildschirm löschst oder ein neues iPhone einrichtest. Für diesen Fall ist das Backup da: eine Kopie als Datei, die du z. B. in iCloud Drive ablegst. Ein Backup alle paar Wochen reicht.</p>
      <p><strong>${backupInfo}</strong></p>
      ${pi ? `<div class="confirm">
          <p>Backup vom ${esc(pi.label)} mit ${pi.days} Tagen laden? Deine aktuellen Daten werden dabei ersetzt.</p>
          <div class="btnrow"><button class="btn ghost" data-act="cancelImport">Abbrechen</button><button class="btn danger-solid" data-act="confirmImport">Backup laden</button></div>
        </div>` : `<div class="btnrow">
          <button class="btn primary" data-act="exportBackup">Backup sichern</button>
          <button class="btn ghost" data-act="pickImport">Backup laden</button>
        </div>`}
    </section>

    <section class="panel">
      <h2>Beispieltage</h2>
      <p>Füllt die letzten sechs Tage mit Beispielen, damit du siehst, wie der Verlauf aussieht. Echte Einträge bleiben unberührt.</p>
      <div class="btnrow">
        ${hasDemo ? '<button class="btn ghost" data-act="demoRemove">Beispiele entfernen</button>' : '<button class="btn ghost" data-act="demoAdd">Beispiele einfügen</button>'}
      </div>
    </section>

    <section class="panel">
      <h2>Neu anfangen</h2>
      ${U.confirmWipe ? `<div class="confirm">
          <p>Wirklich alle Tage, Notizen und Aktivitäten löschen? Das lässt sich nicht rückgängig machen.</p>
          <div class="btnrow"><button class="btn ghost" data-act="cancelWipe">Abbrechen</button><button class="btn danger-solid" data-act="confirmWipe">Alles löschen</button></div>
        </div>` : `<p>Löscht alle Daten und stellt die vorgeschlagenen Aktivitäten wieder her.</p>
        <div class="btnrow"><button class="btn danger" data-act="askWipe">Alle Daten löschen</button></div>`}
    </section>

    <p class="foot">Tagwerk ${VERSION}</p>`;
}

function render() {
  U.renderedToday = todayKey();
  let html = '';
  if (U.view === 'today') html = viewToday();
  else if (U.view === 'plan') html = viewPlan();
  else if (U.view === 'history') html = U.detailKey ? viewDetail() : viewHistory();
  else if (U.view === 'catalog') html = viewCatalog();
  else html = viewMore();
  $('#view').innerHTML = html;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.view === U.view ? 'page' : 'false'));
  document.querySelectorAll('.note-input').forEach(autosize);
}
function renderCatList() { const el = $('#cat-list'); if (el) el.innerHTML = catList(); }
function autosize(el) { el.style.height = 'auto'; el.style.height = Math.max(84, el.scrollHeight + 2) + 'px'; }

/* ---------- Sheets ---------- */
function openSheet(type, ctx) {
  SH.type = type; SH.ctx = ctx;
  renderSheet(true);
  const s = $('#sheet');
  s.hidden = false;
  document.body.classList.add('noscroll');
  requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add('open')));
}
function closeSheet() {
  const s = $('#sheet');
  s.classList.remove('open');
  document.body.classList.remove('noscroll');
  SH.type = null; SH.ctx = null;
  setTimeout(() => { if (!SH.type) { s.hidden = true; $('#sheet-panel').innerHTML = ''; } }, 230);
  render();
}
function renderSheet(reset) {
  const p = $('#sheet-panel');
  const top = reset ? 0 : p.scrollTop;
  let html = '';
  if (SH.type === 'dur') html = sheetDur(SH.ctx);
  else if (SH.type === 'picker') html = sheetPicker(SH.ctx);
  else if (SH.type === 'act') html = sheetAct(SH.ctx);
  else if (SH.type === 'cat') html = sheetCat(SH.ctx);
  else if (SH.type === 'planval') html = sheetPlanVal(SH.ctx);
  p.innerHTML = '<div class="grab" aria-hidden="true"></div>' + html;
  p.scrollTop = top;
}
const closeBtn = '<button class="iconbtn" data-act="closeSheet" aria-label="Schließen">' + ICON.close + '</button>';

function sheetDur({ k, id }) {
  const it = findItem(k, id);
  if (!it) return '';
  return `
    <div class="sheet-head"><div><p class="eyebrow">${esc(goalText(it.type, it.target, it.dir, it.unit))}${it.cond ? ' · ' + condText(it.cond) : ''}</p><h2 class="sheet-title">${esc(it.name)}</h2></div>${closeBtn}</div>
    <div class="field">
      <label for="dur-input">Gemacht</label>
      <div class="bignum"><input id="dur-input" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="1440" value="${it.value || ''}" placeholder="0"><span>min</span></div>
    </div>
    <div class="chips">
      <button class="chip" data-act="durAdd" data-n="5">+5</button>
      <button class="chip" data-act="durAdd" data-n="15">+15</button>
      <button class="chip" data-act="durAdd" data-n="30">+30</button>
      <button class="chip" data-act="durAdd" data-n="60">+60</button>
      <button class="chip goal" data-act="durSetVal" data-n="${it.target}">${it.target} min</button>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" data-act="durSetVal" data-n="0">Auf 0</button>
      <button class="btn primary" data-act="durSave">Speichern</button>
    </div>`;
}

function sheetPlanVal({ k, id, f }) {
  const it = findItem(k, id);
  if (!it) return '';
  const isCount = it.type === 'count';
  const cur = f === 'est' ? (it.est || '') : it.target;
  const label = f === 'est' ? 'Geplante Dauer' : (isCount ? (it.dir === 'max' ? 'Höchstens' : 'Mindestens') : (it.dir === 'max' ? 'Höchstens' : 'Geplante Dauer'));
  const unit = isCount && f === 'target' ? esc(it.unit || '×') : 'min';
  const chips = isCount && f === 'target' ? [1, 2, 3, 5, 10] : [15, 30, 45, 60, 90, 120];
  return `
    <div class="sheet-head"><div><p class="eyebrow">${relLabel(k)} · nur für diesen Tag</p><h2 class="sheet-title">${esc(it.name)}</h2></div>${closeBtn}</div>
    <div class="field">
      <label for="dur-input">${label}</label>
      <div class="bignum"><input id="dur-input" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="1440" value="${cur}" placeholder="0"><span>${unit}</span></div>
    </div>
    <div class="chips">${chips.map(n => `<button class="chip" data-act="durSetVal" data-n="${n}">${n}</button>`).join('')}</div>
    <div class="sheet-actions">
      <button class="btn ghost" data-act="closeSheet">Abbrechen</button>
      <button class="btn primary" data-act="planValSave">Übernehmen</button>
    </div>`;
}

/* Hinzufügen-Liste: Favoriten zuerst, Kategorie antippen klappt alle auf, Suche durchsucht alles */
function pickList() {
  const ctx = SH.ctx, k = ctx.k;
  const d = getDay(k, true);
  const have = new Set(d.items.map(i => i.aid));
  const q = (ctx.q || '').trim().toLowerCase();
  const html = S.categories.map(c => {
    const all = S.activities.filter(a => a.cat === c.id);
    const acts = all.filter(a => matches(a, q));
    if (!acts.length) return '';
    const expanded = !!q || !!c.once || !!ctx.open[c.id];
    const shown = expanded ? acts : acts.filter(a => a.fav || have.has(a.id));
    const hidden = acts.length - shown.length;
    return `<div class="pick-group">
      <button class="pick-cat" data-act="pickCat" data-id="${c.id}" aria-expanded="${expanded}" ${q || c.once ? 'disabled' : ''}>
        <span class="eyebrow">${esc(c.name)}</span><span class="cat-count">${all.length}</span>${q || c.once ? '' : ICON.chev}
      </button>
      ${shown.map(a => `<button class="pick ${have.has(a.id) ? 'added' : ''}" data-act="pick" data-k="${k}" data-aid="${a.id}" aria-pressed="${have.has(a.id)}">
        <span class="row-body"><span class="row-name">${esc(a.name)}</span><span class="row-meta">${esc(actMeta(a))}</span></span>
        <span class="pick-mark">${have.has(a.id) ? ICON.check : '+'}</span>
      </button>`).join('')}
      ${!expanded && hidden ? `<button class="pick-more" data-act="pickCat" data-id="${c.id}">${hidden} weitere anzeigen</button>` : ''}
    </div>`;
  }).join('');
  return html || `<p class="hint">Keine Aktivität mit „${esc(ctx.q)}“. Leg sie direkt hier unten an.</p>`;
}

function blankDraft(cat, name = '') {
  return { id: uid(), name, cat, type: 'check', target: null, dir: 'min', est: null, unit: '', rep: { kind: 'none', days: [] }, cond: null, fav: false };
}

function sheetPicker(ctx) {
  const k = ctx.k;
  return `
    <div class="sheet-head"><div><p class="eyebrow">${relLabel(k)} · ${longDate(k)}</p><h2 class="sheet-title">Hinzufügen</h2></div><button class="btn primary small" data-act="closeSheet">Fertig</button></div>
    <input id="pick-search" class="input" type="search" placeholder="Aktivität suchen" autocomplete="off" enterkeyhint="search" value="${esc(ctx.q || '')}">
    <div class="pick-list" id="pick-list">${pickList()}</div>
    <section class="pick-new">
      <div><p class="eyebrow">Nicht dabei?</p><h3 class="sheet-title small">Neue Aktivität</h3></div>
      <div id="act-form" class="form">${actFields(ctx.draft)}</div>
      <p class="form-error" id="f-error" hidden></p>
      <button class="btn primary" data-act="saveActInline">Anlegen und hinzufügen</button>
    </section>`;
}

function seg(field, opts, val) {
  return `<div class="seg" role="group">${opts.map(([v, l]) => `<button type="button" class="seg-btn" data-act="seg" data-f="${field}" data-v="${v}" aria-pressed="${v === val}">${l}</button>`).join('')}</div>`;
}

function actFields(a) {
  const once = isOnceCat(a.cat);
  const catOpts = S.categories.map(c => `<option value="${c.id}" ${c.id === a.cat ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  const estField = `<div class="field"><label for="f-est">Übliche Dauer <span class="opt">optional</span></label>
      <div class="inline"><input id="f-est" class="input num" type="number" inputmode="numeric" pattern="[0-9]*" min="0" value="${a.est ?? ''}" placeholder="–"><span class="unit">min</span></div>
      <p class="hint">Startwert beim Planen. Für jeden Tag kannst du die Dauer dort einzeln anpassen.</p></div>`;
  let typeBlock;
  if (once) {
    typeBlock = `${estField}<p class="hint">Einmalige Aufgaben werden abgehakt und verschwinden danach aus der Liste. Im Verlauf stehen sie als „einmalig erledigt“.</p>`;
  } else if (a.type === 'check') {
    typeBlock = estField;
  } else {
    typeBlock = `<div class="field"><span class="label">Ziel</span>${seg('dir', [['min', 'mindestens'], ['max', 'höchstens']], a.dir)}</div>
      <div class="field"><label for="f-target">Standardwert</label>
        <div class="inline"><input id="f-target" class="input num" type="number" inputmode="numeric" pattern="[0-9]*" min="1" value="${a.target ?? ''}">
        ${a.type === 'duration' ? '<span class="unit">min</span>' : `<input id="f-unit" class="input" placeholder="Einheit, z. B. Gläser" value="${esc(a.unit)}" autocomplete="off">`}</div>
        <p class="hint">${a.dir === 'max' ? 'Der Tag zählt als geschafft, solange du nicht drüber liegst.' : 'Der Tag zählt als geschafft, wenn du den Wert erreichst.'} Beim Planen passt du den Wert für jeden Tag einzeln an.</p></div>`;
  }
  const condKind = a.cond ? a.cond.kind : 'none';
  const condBlock = `<div class="field"><span class="label">Uhrzeit</span>${seg('cond', [['none', 'Egal'], ['before', 'Vor'], ['after', 'Nach']], condKind)}
      ${a.cond ? `<div class="inline"><input id="f-time" class="input time" type="time" value="${esc(a.cond.time)}"><span class="unit">Uhr</span></div>
      <p class="hint">${a.cond.kind === 'before' ? 'Zählt nur, wenn du es vor dieser Uhrzeit abhakst oder einträgst.' : 'Zählt nur, wenn du es erst ab dieser Uhrzeit abhakst oder einträgst.'} Nachträge am nächsten Tag gelten als rechtzeitig.</p>` : ''}</div>`;
  const days = a.rep.kind === 'weekly'
    ? `<div class="days">${[1, 2, 3, 4, 5, 6, 0].map(i => `<button type="button" class="day-chip" data-act="dayChip" data-v="${i}" aria-pressed="${a.rep.days.includes(i)}" aria-label="${WD_LONG[i]}">${WD_SHORT[i]}</button>`).join('')}</div>`
    : '';
  return `
    <div class="field"><label for="f-name">Name</label><input id="f-name" class="input" value="${esc(a.name)}" placeholder="z. B. Paket zur Post bringen" autocomplete="off" enterkeyhint="done"></div>
    <div class="field"><label for="f-cat">Kategorie</label><select id="f-cat" class="input">${catOpts}</select></div>
    ${once ? '' : `<div class="field"><span class="label">Art</span>${seg('type', [['check', 'Abhaken'], ['count', 'Anzahl'], ['duration', 'Dauer']], a.type)}</div>`}
    ${typeBlock}
    ${condBlock}
    ${once ? '' : `<div class="field"><span class="label">Wiederholen</span>${seg('rep', [['none', 'Nie'], ['daily', 'Täglich'], ['weekly', 'An Tagen']], a.rep.kind)}${days}</div>
    <button type="button" class="fav-toggle" data-act="favDraft" aria-pressed="${!!a.fav}">${ICON.star}<span>Favorit<span class="opt"> · steht beim Hinzufügen immer oben</span></span></button>`}`;
}

function sheetAct(ctx) {
  const a = ctx.draft;
  const isNew = !actById(a.id);
  let actions;
  if (ctx.confirm) {
    actions = `<div class="confirm"><p>„${esc(a.name)}“ aus dem Katalog löschen? Vergangene Tage behalten ihre Einträge.</p>
      <div class="btnrow"><button class="btn ghost" data-act="cancelDelAct">Abbrechen</button><button class="btn danger-solid" data-act="confirmDelAct">Löschen</button></div></div>`;
  } else {
    actions = `<div class="sheet-actions">
      ${isNew ? '<button class="btn ghost" data-act="closeSheet">Abbrechen</button>' : '<button class="btn danger" data-act="delAct">Löschen</button>'}
      <button class="btn primary" data-act="saveAct">Speichern</button></div>`;
  }
  return `
    <div class="sheet-head"><div><p class="eyebrow">${isNew ? 'Neue Aktivität' : 'Aktivität bearbeiten'}</p><h2 class="sheet-title" id="act-title">${esc(a.name) || 'Ohne Namen'}</h2></div>${closeBtn}</div>
    <div id="act-form" class="form">${actFields(a)}</div>
    <p class="form-error" id="f-error" hidden></p>
    ${actions}`;
}

function renderActForm() { const el = $('#act-form'); if (el) el.innerHTML = actFields(SH.ctx.draft); }
function showFormError(msg) { const el = $('#f-error'); if (el) { el.textContent = msg; el.hidden = !msg; } }

function readActForm() {
  const a = SH.ctx.draft;
  const v = id => { const el = $('#' + id); return el ? el.value : null; };
  if (v('f-name') !== null) a.name = v('f-name').trim();
  if (v('f-cat') !== null) a.cat = v('f-cat');
  if (v('f-est') !== null) { const n = parseInt(v('f-est'), 10); a.est = Number.isFinite(n) && n > 0 ? n : null; }
  if (v('f-target') !== null) { const n = parseInt(v('f-target'), 10); a.target = Number.isFinite(n) && n > 0 ? n : null; }
  if (v('f-unit') !== null) a.unit = v('f-unit').trim();
  if (v('f-time') !== null && a.cond) a.cond.time = v('f-time') || a.cond.time;
}

// Prüft und speichert einen Entwurf. Gibt eine Fehlermeldung zurück oder null.
function commitDraft(a) {
  if (!a.name) return 'Bitte gib einen Namen ein.';
  const once = isOnceCat(a.cat);
  if (once) { a.type = 'check'; a.rep = { kind: 'none', days: [] }; a.fav = false; }
  if (a.type !== 'check' && !a.target) return 'Bitte gib einen Standardwert ein.';
  if (a.rep.kind === 'weekly' && !a.rep.days.length) return 'Bitte wähle mindestens einen Wochentag.';
  if (a.cond && !/^\d{2}:\d{2}$/.test(a.cond.time || '')) return 'Bitte gib eine Uhrzeit ein.';
  if (a.type === 'check') { a.target = null; a.dir = 'min'; a.unit = ''; } else { a.est = null; }
  if (a.type === 'duration') a.unit = '';
  if (a.rep.kind !== 'weekly') a.rep.days = [];
  const i = S.activities.findIndex(x => x.id === a.id);
  if (i >= 0) S.activities[i] = a; else S.activities.push(a);
  syncFutureDays(a, false);
  save();
  return null;
}

function sheetCat(ctx) {
  const isNew = !ctx.id;
  const cat = ctx.id ? catById(ctx.id) : null;
  const n = isNew ? 0 : S.activities.filter(a => a.cat === ctx.id).length;
  let actions;
  if (ctx.confirm) {
    actions = `<div class="confirm"><p>Kategorie „${esc(ctx.name)}“${n ? ` mit ${n} ${n === 1 ? 'Aktivität' : 'Aktivitäten'}` : ''} löschen? Vergangene Tage behalten ihre Einträge.</p>
      <div class="btnrow"><button class="btn ghost" data-act="cancelDelCat">Abbrechen</button><button class="btn danger-solid" data-act="confirmDelCat">Löschen</button></div></div>`;
  } else {
    actions = `<div class="sheet-actions">
      ${isNew ? '<button class="btn ghost" data-act="closeSheet">Abbrechen</button>' : (cat && cat.once ? '' : '<button class="btn danger" data-act="delCat">Löschen</button>')}
      <button class="btn primary" data-act="saveCat">Speichern</button></div>`;
  }
  return `
    <div class="sheet-head"><div><p class="eyebrow">${isNew ? 'Neue Kategorie' : 'Kategorie bearbeiten'}</p><h2 class="sheet-title">${esc(ctx.name) || 'Ohne Namen'}</h2></div>${closeBtn}</div>
    <div class="form">
      <div class="field"><label for="c-name">Name</label><input id="c-name" class="input" value="${esc(ctx.name)}" placeholder="z. B. Garten" autocomplete="off" enterkeyhint="done"></div>
      ${!isNew ? `<div class="field"><span class="label">Reihenfolge</span><div class="btnrow">
        <button class="btn ghost" data-act="moveCat" data-d="-1">Nach oben</button><button class="btn ghost" data-act="moveCat" data-d="1">Nach unten</button></div></div>` : ''}
      <p class="form-error" ${ctx.error ? '' : 'hidden'}>${esc(ctx.error || '')}</p>
    </div>
    ${actions}`;
}

/* ---------- Änderungen an Tagen ---------- */
function syncFutureDays(a, removed) {
  const t = todayKey();
  Object.entries(S.days).forEach(([k, d]) => {
    if (k <= t) return;
    const wd = parseKey(k).getDay();
    if (removed) { d.items = d.items.filter(i => i.aid !== a.id || i.done || i.value); return; }
    d.items.forEach(i => { if (i.aid === a.id) { i.name = a.name; i.cat = a.cat; i.unit = a.unit; i.est = a.est; i.dir = a.dir; i.cond = a.cond ? clone(a.cond) : null; i.once = isOnceCat(a.cat); } });
    const has = d.items.some(i => i.aid === a.id);
    if (repMatches(a, wd) && !has) d.items.push(itemFrom(a, true));
    if (!repMatches(a, wd)) d.items = d.items.filter(i => !(i.aid === a.id && i.rec && !i.done && !i.value));
  });
}

function addToDay(k, a) {
  const d = getDay(k, true);
  if (!d.items.some(x => x.aid === a.id)) d.items.push(itemFrom(a));
  save();
}

let lastRemoved = null;
const ACT = {
  tab(el) {
    const v = el.dataset.view;
    if (v === 'plan' && U.view !== 'plan') U.planKey = addDays(todayKey(), 1);
    if (v === 'history') U.detailKey = null;
    U.view = v; U.confirmWipe = false; U.pendingImport = null;
    render(); window.scrollTo(0, 0);
  },
  toggle(el) {
    const k = el.dataset.k, it = findItem(k, el.dataset.id); if (!it) return;
    it.done = !it.done;
    if (it.type === 'check') { it.at1 = null; it.at2 = null; }
    stamp(k, it, it.done);
    if (it.once) {
      if (it.done) {
        const a = actById(it.aid);
        if (a) { it.onceAct = clone(a); S.activities = S.activities.filter(x => x.id !== a.id); toast('Einmalig erledigt'); }
      } else if (it.onceAct && !actById(it.aid)) {
        S.activities.push(it.onceAct); it.onceAct = null;
      }
    }
    save(); render();
  },
  step(el) {
    const k = el.dataset.k, it = findItem(k, el.dataset.id); if (!it) return;
    const dir = Number(el.dataset.d);
    if (el.dataset.f === 'value') {
      const before = it.value || 0;
      it.value = Math.max(0, before + dir);
      if (it.value !== before) stamp(k, it, it.value > 0);
    } else if (el.dataset.f === 'est') {
      const cur = it.est || 0;
      const stepSize = dir > 0 ? (cur < 30 ? 5 : 15) : (cur <= 30 ? 5 : 15);
      const nv = cur + dir * stepSize;
      it.est = nv > 0 ? nv : null;
    } else if (it.type === 'count') {
      it.target = Math.max(1, it.target + dir);
    } else {
      const cur = it.target;
      const stepSize = dir > 0 ? (cur < 30 ? 5 : 15) : (cur <= 30 ? 5 : 15);
      it.target = Math.max(5, cur + dir * stepSize);
    }
    save(); render();
  },
  dur(el) { openSheet('dur', { k: el.dataset.k, id: el.dataset.id }); },
  planVal(el) { openSheet('planval', { k: el.dataset.k, id: el.dataset.id, f: el.dataset.f }); },
  planValSave() {
    const { k, id, f } = SH.ctx, it = findItem(k, id); if (!it) return closeSheet();
    const n = clampInt(parseInt($('#dur-input').value, 10) || 0, 0, 1440);
    if (f === 'est') it.est = n > 0 ? n : null;
    else it.target = Math.max(1, n || it.target);
    save(); closeSheet();
  },
  durAdd(el) { const i = $('#dur-input'); i.value = clampInt((parseInt(i.value, 10) || 0) + Number(el.dataset.n), 0, 1440); },
  durSetVal(el) { $('#dur-input').value = el.dataset.n === '0' ? '' : el.dataset.n; },
  durSave() {
    const k = SH.ctx.k, it = findItem(k, SH.ctx.id); if (!it) return closeSheet();
    const before = it.value || 0;
    it.value = clampInt(parseInt($('#dur-input').value, 10) || 0, 0, 1440);
    if (it.value !== before) stamp(k, it, it.value > 0);
    save(); closeSheet();
  },
  mood(el) {
    const d = getDay(el.dataset.k, true), v = Number(el.dataset.v);
    d.mood = d.mood === v ? null : v;
    save();
    el.parentElement.querySelectorAll('.mood').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === d.mood)));
  },
  toggleEdit(el) { const k = el.dataset.k; U.edit[k] = !U.edit[k]; render(); },
  removeItem(el) {
    const k = el.dataset.k, d = S.days[k]; if (!d) return;
    const idx = d.items.findIndex(i => i.id === el.dataset.id); if (idx < 0) return;
    const [it] = d.items.splice(idx, 1);
    lastRemoved = { k, it, idx };
    save(); render();
    toast(`„${it.name}“ entfernt`, { label: 'Rückgängig', fn: () => { if (!lastRemoved) return; const day = getDay(lastRemoved.k, true); day.items.splice(lastRemoved.idx, 0, lastRemoved.it); lastRemoved = null; save(); render(); } });
  },
  openPicker(el) {
    const first = S.categories.find(c => c.once) || S.categories[0];
    openSheet('picker', { k: el.dataset.k, q: '', open: {}, draft: blankDraft(first ? first.id : ''), nameTouched: false });
  },
  pickCat(el) { const o = SH.ctx.open; o[el.dataset.id] = !o[el.dataset.id]; $('#pick-list').innerHTML = pickList(); },
  pick(el) {
    const k = el.dataset.k, d = getDay(k, true), a = actById(el.dataset.aid); if (!a) return;
    const idx = d.items.findIndex(i => i.aid === a.id);
    const added = idx < 0;
    if (added) d.items.push(itemFrom(a)); else d.items.splice(idx, 1);
    save();
    el.classList.toggle('added', added);
    el.setAttribute('aria-pressed', String(added));
    el.querySelector('.pick-mark').innerHTML = added ? ICON.check : '+';
    render();
  },
  saveActInline() {
    readActForm();
    const ctx = SH.ctx, a = ctx.draft;
    const err = commitDraft(a);
    if (err) { showFormError(err); return; }
    addToDay(ctx.k, a);
    ctx.draft = blankDraft(a.cat);
    ctx.q = ''; ctx.nameTouched = false;
    renderSheet(true);
    render();
    toast(`„${a.name}“ hinzugefügt`);
  },
  copyToday(el) {
    const k = el.dataset.k, d = getDay(k, true), src = S.days[todayKey()]; if (!src) return;
    src.items.forEach(it => {
      if (it.once || d.items.some(i => i.aid === it.aid)) return;
      d.items.push({ ...clone(it), id: uid(), done: false, value: 0, at1: null, at2: null, rec: false });
    });
    save(); render(); toast('Von heute übernommen');
  },
  planShift(el) { U.planKey = addDays(U.planKey, Number(el.dataset.d)); render(); },
  goPlan() { U.view = 'plan'; U.planKey = addDays(todayKey(), 1); render(); window.scrollTo(0, 0); },
  openDay(el) {
    const k = el.dataset.k;
    if (k === todayKey()) { U.view = 'today'; render(); window.scrollTo(0, 0); return; }
    U.detailKey = k; render(); window.scrollTo(0, 0);
  },
  closeDetail() { U.detailKey = null; render(); },
  histMore() { U.histLimit += 60; render(); },
  toggleCat(el) { const id = el.dataset.id; S.ui.open[id] = !S.ui.open[id]; save(); renderCatList(); },
  favToggle(el) {
    const a = actById(el.dataset.id); if (!a) return;
    a.fav = !a.fav; save(); renderCatList();
    toast(a.fav ? `„${a.name}“ ist Favorit` : `„${a.name}“ ist kein Favorit mehr`);
  },
  favDraft(el) { SH.ctx.draft.fav = !SH.ctx.draft.fav; el.setAttribute('aria-pressed', String(SH.ctx.draft.fav)); },
  newAct(el) {
    const cat = el.dataset.cat || (S.categories[0] && S.categories[0].id);
    if (!cat) { toast('Leg zuerst eine Kategorie an.'); return; }
    openSheet('act', { draft: blankDraft(cat) });
  },
  editAct(el) {
    const a = actById(el.dataset.id); if (!a) return;
    openSheet('act', { draft: clone(a) });
  },
  seg(el) {
    readActForm();
    const a = SH.ctx.draft, f = el.dataset.f, v = el.dataset.v;
    if (f === 'type') { a.type = v; if (v !== 'check' && !a.target) a.target = v === 'count' ? 1 : 30; }
    if (f === 'dir') a.dir = v;
    if (f === 'rep') a.rep.kind = v;
    if (f === 'cond') a.cond = v === 'none' ? null : { kind: v, time: (a.cond && a.cond.time) || (v === 'before' ? '23:00' : '18:00') };
    showFormError('');
    renderActForm();
  },
  dayChip(el) {
    readActForm();
    const a = SH.ctx.draft, v = Number(el.dataset.v);
    a.rep.days = a.rep.days.includes(v) ? a.rep.days.filter(x => x !== v) : [...a.rep.days, v];
    renderActForm();
  },
  saveAct() {
    readActForm();
    const a = SH.ctx.draft;
    const err = commitDraft(a);
    if (err) { showFormError(err); return; }
    S.ui.open[a.cat] = true; save();
    closeSheet();
    toast('Gespeichert');
  },
  delAct() { readActForm(); SH.ctx.confirm = true; renderSheet(); },
  cancelDelAct() { SH.ctx.confirm = false; renderSheet(); },
  confirmDelAct() {
    const a = SH.ctx.draft;
    S.activities = S.activities.filter(x => x.id !== a.id);
    syncFutureDays(a, true);
    save(); closeSheet(); toast('Gelöscht');
  },
  newCat() { openSheet('cat', { id: null, name: '' }); },
  editCat(el) { const c = catById(el.dataset.id); if (c) openSheet('cat', { id: c.id, name: c.name }); },
  saveCat() {
    const name = $('#c-name').value.trim();
    if (!name) { SH.ctx.error = 'Bitte gib einen Namen ein.'; renderSheet(); return; }
    if (SH.ctx.id) { const c = catById(SH.ctx.id); if (c) c.name = name; }
    else { const id = uid(); S.categories.push({ id, name }); S.ui.open[id] = true; }
    save(); closeSheet(); toast('Gespeichert');
  },
  moveCat(el) {
    const i = S.categories.findIndex(c => c.id === SH.ctx.id), j = i + Number(el.dataset.d);
    if (i < 0 || j < 0 || j >= S.categories.length) return;
    const [c] = S.categories.splice(i, 1); S.categories.splice(j, 0, c);
    save(); render(); toast(Number(el.dataset.d) < 0 ? 'Nach oben verschoben' : 'Nach unten verschoben');
  },
  delCat() { const v = $('#c-name'); if (v) SH.ctx.name = v.value.trim() || SH.ctx.name; SH.ctx.confirm = true; renderSheet(); },
  cancelDelCat() { SH.ctx.confirm = false; renderSheet(); },
  confirmDelCat() {
    const id = SH.ctx.id;
    S.activities.filter(a => a.cat === id).forEach(a => syncFutureDays(a, true));
    S.activities = S.activities.filter(a => a.cat !== id);
    S.categories = S.categories.filter(c => c.id !== id);
    save(); closeSheet(); toast('Kategorie gelöscht');
  },
  closeSheet() { closeSheet(); },
  exportBackup() { exportBackup(); },
  pickImport() { $('#import-file').click(); },
  cancelImport() { U.pendingImport = null; render(); },
  confirmImport() {
    if (!U.pendingImport) return;
    S = normalize(U.pendingImport.data);
    U.pendingImport = null;
    save(); render(); toast('Backup geladen');
  },
  demoAdd() { seedDemo(S, false); save(); render(); toast('Beispiele eingefügt'); },
  demoRemove() {
    Object.keys(S.days).forEach(k => { if (S.days[k].demo) delete S.days[k]; });
    save(); render(); toast('Beispiele entfernt');
  },
  askWipe() { U.confirmWipe = true; render(); },
  cancelWipe() { U.confirmWipe = false; render(); },
  confirmWipe() {
    S = freshState();
    U.confirmWipe = false; U.edit = {};
    save(); render(); toast('Alles gelöscht');
  },
};

/* ---------- Backup ---------- */
async function exportBackup() {
  if (PREVIEW) { toast('Backups funktionieren in der installierten App.'); return; }
  const json = JSON.stringify({ app: 'tagwerk', version: VERSION, exported: new Date().toISOString(), data: S });
  const name = `tagwerk-backup-${todayKey()}.json`;
  let file;
  try { file = new File([json], name, { type: 'application/json' }); } catch (e) { file = null; }
  try {
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Tagwerk Backup' });
      markBackup(); return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  try {
    const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    markBackup();
  } catch (e) { toast('Backup konnte nicht erstellt werden.'); }
}
function markBackup() { S.lastBackup = new Date().toISOString(); save(); render(); toast('Backup gesichert'); }

$('#import-file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const obj = JSON.parse(r.result);
      const data = obj && obj.data ? obj.data : obj;
      if (!data || !Array.isArray(data.activities) || !data.days) throw new Error('format');
      const dt = obj.exported ? new Date(obj.exported) : null;
      U.pendingImport = {
        data,
        days: Object.keys(data.days).length,
        label: dt ? `${dt.getDate()}. ${MONTHS[dt.getMonth()]} ${dt.getFullYear()}` : 'unbekanntem Datum',
      };
      render();
    } catch (err) { toast('Diese Datei ist kein Tagwerk-Backup.'); }
  };
  r.readAsText(f);
});

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg, action) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button class="toast-btn" type="button">${esc(action.label)}</button>` : ''}`;
  if (action) t.querySelector('.toast-btn').onclick = () => { action.fn(); hideToast(); };
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, action ? 5000 : 2000);
}
function hideToast() { $('#toast').classList.remove('show'); }

/* ---------- Ereignisse ---------- */
document.addEventListener('click', e => {
  if (e.target.id === 'sheet') { closeSheet(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});

let noteTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.note) {
    const k = t.dataset.note;
    const d = getDay(k, true);
    d.note = t.value;
    autosize(t);
    clearTimeout(noteTimer);
    noteTimer = setTimeout(save, 350);
  } else if (t.id === 'pick-search') {
    SH.ctx.q = t.value;
    $('#pick-list').innerHTML = pickList();
    if (!SH.ctx.nameTouched) {
      SH.ctx.draft.name = t.value.trim();
      const n = $('#f-name'); if (n) n.value = SH.ctx.draft.name;
    }
  } else if (t.id === 'cat-search') {
    U.catQuery = t.value;
    renderCatList();
  } else if (t.id === 'f-name') {
    if (SH.type === 'picker') SH.ctx.nameTouched = true;
    const h = $('#act-title'); if (h) h.textContent = t.value.trim() || 'Ohne Namen';
  } else if (t.id === 'c-name') {
    const h = $('.sheet-title'); if (h) h.textContent = t.value.trim() || 'Ohne Namen';
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'f-cat' && SH.ctx && SH.ctx.draft) {
    readActForm();
    const a = SH.ctx.draft;
    if (isOnceCat(a.cat)) { a.type = 'check'; a.rep = { kind: 'none', days: [] }; }
    renderActForm();
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const id = e.target.id;
  if (id === 'dur-input') { e.preventDefault(); if (SH.type === 'planval') ACT.planValSave(); else ACT.durSave(); }
  if (['f-name', 'f-target', 'f-est', 'f-unit', 'pick-search', 'cat-search'].includes(id)) { e.preventDefault(); e.target.blur(); }
  if (id === 'c-name') { e.preventDefault(); ACT.saveCat(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && SH.type) closeSheet(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    save();
    if (U.renderedToday !== todayKey() && !SH.type) render();
  } else {
    clearTimeout(noteTimer); save();
  }
});
window.addEventListener('pagehide', () => save());

render();

if (!PREVIEW && 'serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
